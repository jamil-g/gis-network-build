services:
  db:
    # If you want to pin an exact version later (not latest), check the current tags at:
    # https://hub.docker.com/r/pgrouting/pgrouting/tags
    image: pgrouting/pgrouting:latest
    container_name: gis-network-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis_password}
      POSTGRES_DB: ${POSTGRES_DB:-network_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis_admin} -d ${POSTGRES_DB:-network_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: python/Dockerfile
    container_name: gis-network-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis_admin}:${POSTGRES_PASSWORD:-gis_password}@db:5432/${POSTGRES_DB:-network_db}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-nominatim}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://routing.openstreetmap.de/routed-foot}
      OSRM_PROFILE: ${OSRM_PROFILE:-foot}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
